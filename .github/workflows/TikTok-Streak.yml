name: TikTok Streak

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  streak:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run TikTok Streak
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: node index.js

      - name: Discord Notification
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          curl -X POST "$WEBHOOK?with_components=true" \
            -H "Content-Type: application/json" \
            -d '{
              "flags": 32768,
              "components": [
                {
                  "type": 17,
                  "components": [
                    {
                      "type": 10,
                      "content": "## TikTok Streak"
                    },
                    {
                      "type": 14,
                      "divider": true,
                      "spacing": 1
                    },
                    {
                      "type": 10,
                      "content": "**Status:** `${{ job.status }}`\n**Repository:** `${{ github.repository }}`\n**Trigger:** `${{ github.event_name }}`"
                    },
                    {
                      "type": 1,
                      "components": [
                        {
                          "type": 2,
                          "style": 5,
                          "label": "View GitHub Run",
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }'
